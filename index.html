<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>jubeat模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #pixiCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        #loadingText {
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        #progressBar {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        
        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        #menuScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1a2e, #16213e);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        
        .menu-title {
            font-size: 48px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px #00eeff;
            color: #00eeff;
        }
        
        .song-list {
            width: 80%;
            max-height: 60%;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
        }
        
        .song-item {
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        
        .song-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(10px);
        }
        
        .song-cover {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
        }
        
        .song-info {
            flex: 1;
        }
        
        .song-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .song-artist {
            font-size: 14px;
            color: #aaa;
        }
        
        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .difficulty-btn {
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .difficulty-btn.basic { background: #4ecdc4; }
        .difficulty-btn.advanced { background: #ffd166; }
        .difficulty-btn.extreme { background: #ff6b6b; }
        
        .difficulty-btn.selected {
            transform: scale(1.1);
            box-shadow: 0 0 15px currentColor;
        }
        
        .play-btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(45deg, #00eeff, #0088ff);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00eeff;
        }
        
        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        
        .score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        .combo-display {
            position: absolute;
            top: 60px;
            left: 20px;
            font-size: 18px;
            color: #ffcc00;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        .judgment-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            opacity: 0;
            transition: all 0.3s ease;
            text-shadow: 0 0 20px currentColor;
        }
        
        .hit-area {
            position: absolute;
            width: 25%;
            height: 25%;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        /* 移动端优化 */
        @media (hover: none) and (pointer: coarse) {
            .song-item:hover {
                transform: none;
            }
            
            .difficulty-btn {
                min-width: 60px;
                padding: 10px 12px;
            }
            
            .play-btn {
                padding: 18px 45px;
                font-size: 22px;
            }
        }
        
        @media (max-width: 768px) {
            .menu-title {
                font-size: 32px;
            }
            
            .song-list {
                width: 95%;
            }
            
            .song-item {
                padding: 12px;
            }
            
            .song-cover {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="loadingScreen">
            <div id="loadingText">正在加载资源...</div>
            <div id="progressBar">
                <div id="progressFill"></div>
            </div>
        </div>
        
        <div id="menuScreen">
            <h1 class="menu-title">JUBEAT SIMULATOR</h1>
            <div class="song-list" id="songList">
                <!-- 歌曲列表将在这里动态生成 -->
            </div>
            <button class="play-btn" id="startGameBtn">开始游戏</button>
        </div>
        
        <div id="gameUI">
            <div class="score-display" id="scoreDisplay">SCORE: 0</div>
            <div class="combo-display" id="comboDisplay">COMBO: 0</div>
            <div class="judgment-display" id="judgmentDisplay"></div>
        </div>
        
        <canvas id="pixiCanvas"></canvas>
    </div>

    <!-- 引入Pixi.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    
    <!-- 游戏主逻辑 -->
    <script src="js/main.js"></script>
    <script src="js/game.js"></script>
    <script src="js/songLoader.js"></script>
    <script src="js/judgment.js"></script>
</body>
</html>
