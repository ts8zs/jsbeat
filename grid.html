<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSBeat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            position: relative;
            height: 100vh;
            width: 100vw;
        }
        
        /* Pixi画布容器 */
        #pixiContainer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vmin;
            height: 100vmin;
        }
        
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* 控制按钮容器样式 */
        .controls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        /* 竖屏模式：按钮横向排列 */
        @media (orientation: portrait) {
            .controls {
                flex-direction: row;
            }
        }
        
        /* 横屏模式：按钮纵向排列 */
        @media (orientation: landscape) {
            .controls {
                flex-direction: column;
            }
        }
        
        .control-button {
            width: 50px; /* 增大按钮 */
            height: 50px; /* 增大按钮 */
            background-color: rgba(52, 152, 219, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px; /* 增大图标 */
        }
        
        .control-button:hover {
            background-color: rgba(41, 128, 185, 0.9);
        }
        
        .control-button:active {
            background-color: rgba(33, 97, 140, 1);
        }
        
        /* 歌曲信息和判定统计容器样式 */
        .info-container {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
            color: white;
            font-family: Arial, sans-serif;
            max-width: 40vw;
        }
        
        .song-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .song-artist {
            font-size: 16px;
            opacity: 0.9;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .score-display {
            font-size: 24px;
            font-weight: bold;
            margin-top: 8px;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        .stat-item {
            margin: 3px 0;
            font-weight: bold;
            font-size: 16px;
            line-height: 1.8;
        }
        .stat-perfect { color: #FFD700; }
        .stat-great { color: #00BFFF; }
        .stat-good { color: #32CD32; }
        .stat-poor { color: #FF6347; }
        .stat-miss { color: #808080; }
        .stat-maxcombo { color: #FF69B4; }
        
        /* 进度条样式 */
        .progress-container {
            position: fixed;
            z-index: 100;
            display: flex;
            align-items: center;
        }
        
        /* 竖屏模式：进度条在顶部横向显示 */
        @media (orientation: portrait) {
            .progress-container {
                top: 0; /* 页面最顶端 */
                left: 0;
                width: 100vw;
                height: 12px; /* 增加高度 */
                flex-direction: row;
            }
            
            .progress-bar-wrapper {
                width: 100%;
                height: 12px; /* 增加高度 */
                background-color: rgba(255, 255, 255, 0.3);
                cursor: pointer;
                position: relative;
            }
            
            .progress-bar-fill {
                height: 100%;
                background-color: rgba(255, 215, 0, 0.8); /* 金黄色 */
                width: 0%;
                transition: width 0.1s linear;
            }
            
            /* 判定标记点容器 */
            .judgment-marks {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }
            
            /* 判定标记点 */
            .judgment-mark {
                position: absolute;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 6px;
                height: 6px;
                border-radius: 50%;
                opacity: 0.8;
            }
            
            .mark-miss,
            .mark-poor {
                background-color: #808080; /* 灰色 */
            }
            
            .mark-good {
                background-color: #32CD32; /* 绿色 */
            }
            
            .mark-great {
                background-color: #00BFFF; /* 蓝色 */
            }
        }
        
        /* 横屏模式：进度条在左侧竖向显示 */
        @media (orientation: landscape) {
            .progress-container {
                top: 0; /* 页面最顶端 */
                left: 0; /* 页面最左端 */
                width: 12px; /* 增加宽度 */
                height: 100vh; /* 占满整个高度 */
                flex-direction: column;
            }
            
            .progress-bar-wrapper {
                width: 12px; /* 增加宽度 */
                height: 100%;
                background-color: rgba(255, 255, 255, 0.3);
                cursor: pointer;
                position: relative;
                display: flex;
                align-items: flex-end;
            }
            
            .progress-bar-fill {
                width: 100%;
                height: 0%;
                background-color: rgba(255, 215, 0, 0.8); /* 金黄色 */
                transition: height 0.1s linear;
            }
            
            /* 判定标记点容器 */
            .judgment-marks {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }
            
            /* 判定标记点 */
            .judgment-mark {
                position: absolute;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 6px;
                height: 6px;
                border-radius: 50%;
                opacity: 0.8;
            }
            
            .mark-miss,
            .mark-poor {
                background-color: #808080; /* 灰色 */
            }
            
            .mark-good {
                background-color: #32CD32; /* 绿色 */
            }
            
            .mark-great {
                background-color: #00BFFF; /* 蓝色 */
            }
        }
    </style>
</head>
<body>
    <div id="pixiContainer">
        <!-- Pixi画布将在这里创建 -->
    </div>
    
    <div class="info-container" id="infoContainer">
        <div class="song-title" id="songTitle">加载中...</div>
        <div class="song-artist" id="songArtist"></div>
        <div class="score-display" id="scoreDisplay">0</div>
        <div class="stat-item stat-maxcombo">Max Combo: <span id="maxComboCount">0</span></div>
        <div class="stat-item stat-perfect">Perfect: <span id="perfectCount">0</span></div>
        <div class="stat-item stat-great">Great: <span id="greatCount">0</span></div>
        <div class="stat-item stat-good">Good: <span id="goodCount">0</span></div>
        <div class="stat-item stat-poor">Poor: <span id="poorCount">0</span></div>
        <div class="stat-item stat-miss">Miss: <span id="missCount">0</span></div>
    </div>
    
    <div class="controls">
        <button id="backButton" class="control-button" title="返回">⬅️</button>
        <button id="replayButton" class="control-button" title="重玩">🔄</button>
        <button id="playButton" class="control-button" title="播放">▶️</button>
    </div>
    
    <div class="progress-container" id="progressContainer" style="display: none;">
        <div class="progress-bar-wrapper" id="progressBarWrapper">
            <div class="progress-bar-fill" id="progressBarFill"></div>
            <div class="judgment-marks" id="judgmentMarks"></div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script>
        // 获取容器
        const pixiContainer = document.getElementById('pixiContainer');
        
        // 计算容器大小（1:1比例）
        function getContainerSize() {
            const minDimension = Math.min(window.innerWidth, window.innerHeight);
            return { width: minDimension, height: minDimension };
        }
        
        const containerSize = getContainerSize();
        
        // 初始化Pixi应用
        const app = new PIXI.Application({
            width: containerSize.width,
            height: containerSize.height,
            backgroundColor: 0x000000, // 黑色背景
            antialias: true,
            autoDensity: true,
            resolution: window.devicePixelRatio || 1
        });
        
        pixiContainer.appendChild(app.view);

        // 创建容器用于放置4x4网格
        const gridContainer = new PIXI.Container();
        app.stage.addChild(gridContainer);
        
        // 创建专辑封面背景容器（在最底层）
        const albumCoverContainer = new PIXI.Container();
        app.stage.addChildAt(albumCoverContainer, 0);

        // 定义网格参数
        const gridSize = 4;
        let cellSize = 0;
        let gridWidth = 0;
        let gridHeight = 0;
        
        // 帧动画相关变量
        let markerBasePath;
        let touchPerfectPath;
        let touchGreatPath;
        let touchGoodPath;
        let touchPoorPath;
        const totalFrames = 25;
        const touchPerfectFrames = 15;
        
        // 音频相关变量
        let audioContext = null;
        let audioBuffer = null;
        let audioSource = null;
        let isPlaying = false;
        let startTime = 0;
        let pauseTime = 0;
        let songPath = './songs/Evans/song.mp3'; // 默认值
        
        // 谱面数据
        let chartData = [];
        let chartPath = './songs/Evans/pt_ext.jmt'; // 默认值
        
        // 已判定的note集合（用于防止重复判定）
        const judgedNotes = new Set();
        
        // Combo和判定统计
        let combo = 0;
        let maxCombo = 0;
        let score = 0; // 当前分数
        const stats = {
            perfect: 0,
            great: 0,
            good: 0,
            poor: 0,
            miss: 0
        };
        
        // 游戏结束显示文本
        let resultScoreText = null;
        let resultMaxComboText = null;
        let resultGradeText = null;
        let isGameEnded = false; // 标记游戏是否结束
        
        // Combo显示文本
        let comboText = null;
        let comboLabelText = null;
        let lastCombo = 0; // 记录上一次的combo值，用于检测变化
        
        // 专辑封面相关变量
        let albumCoverSprite = null;
        let songDirectory = './songs/Evans/'; // 默认歌曲目录
        let songName = 'Evans'; // 默认歌曲名称
        let artistName = ''; // 默认歌手名称（Composer）
        
        // 解析manifest.txt文件
        async function loadManifest() {
            try {
                const manifestPath = `${songDirectory}manifest.txt`;
                const response = await fetch(manifestPath);
                const text = await response.text();
                
                // 解析Name字段
                const nameMatch = text.match(/^Name=(.+)$/m);
                if (nameMatch && nameMatch[1]) {
                    songName = nameMatch[1].trim();
                }
                
                // 解析Composer字段
                const composerMatch = text.match(/^Composer=(.+)$/m);
                if (composerMatch && composerMatch[1]) {
                    artistName = composerMatch[1].trim();
                }
                
                console.log(`歌曲信息: ${songName} - ${artistName}`);
                
                // 更新UI显示
                updateSongInfo();
                
            } catch (error) {
                console.warn('无法加载manifest.txt，使用默认值:', error);
                updateSongInfo();
            }
        }
        
        // 更新歌曲信息显示
        function updateSongInfo() {
            const songTitleElement = document.getElementById('songTitle');
            const songArtistElement = document.getElementById('songArtist');
            
            if (songTitleElement) {
                songTitleElement.textContent = songName || '未知曲目';
            }
            
            if (songArtistElement) {
                songArtistElement.textContent = artistName || '';
            }
        }
        
        // 从 URL 参数获取曲目和难度
        let selectedMarker = 'thundergate'; // 默认marker，从URL参数获取
        
        function parseURLParams() {
            const params = new URLSearchParams(window.location.search);
            const song = params.get('song');
            const difficulty = params.get('difficulty');
            const chart = params.get('chart');
            const marker = params.get('marker');
            
            if (marker) {
                selectedMarker = marker;
                console.log(`使用Marker: ${selectedMarker}`);
            }
            
            // 根据选中的marker设置路径
            markerBasePath = `./markers/${selectedMarker}/marker_base/`;
            touchPerfectPath = `./markers/${selectedMarker}/touch_perfect/`;
            touchGreatPath = `./markers/${selectedMarker}/touch_great/`;
            touchGoodPath = `./markers/${selectedMarker}/touch_good/`;
            touchPoorPath = `./markers/${selectedMarker}/touch_poor/`;
            
            if (song && chart) {
                songPath = `./songs/${song}/song.mp3`;
                chartPath = `./songs/${song}/${chart}`;
                songDirectory = `./songs/${song}/`; // 保存歌曲目录路径
                console.log(`加载曲目: ${song}, 难度: ${difficulty}, 谱面: ${chart}`);
                console.log(`歌曲路径: ${songPath}`);
                console.log(`谱面路径: ${chartPath}`);
            } else {
                console.log('未检测到URL参数，使用默认配置');
            }
        }
        
        // Note对象数组，每个格子一个
        const notes = [];
        const totalCells = 16; // 4x4网格
        
        // 判定窗口（帧编号1-based，代码中使用索引0-based）
        // Perfect: 帧14~18 (索引13~17)
        const perfectWindowStart = 13; // 帧14
        const perfectWindowEnd = 17;   // 帧18
        
        // Great: 帧11~13 (索引10~12) 和 帧18~20 (索引17~19)
        const greatWindows = [
            { start: 10, end: 12 },  // 帧11~13
            { start: 17, end: 19 }   // 帧18~20
        ];
        
        // Good: 帧8~10 (索引7~9) 和 帧21~23 (索引20~22)
        const goodWindows = [
            { start: 7, end: 9 },    // 帧8~10
            { start: 20, end: 22 }   // 帧21~23
        ];
        
        // Poor: 帧1~9 (索引0~8) 和 帧24~25 (索引23~24)
        const poorWindows = [
            { start: 0, end: 8 },    // 帧1~9
            { start: 23, end: 24 }   // 帧24~25
        ];
        
        // Start Here提示文本
        let startHereTexts = [];
        
        // 每个格子的play_button图片
        const playButtons = [];

        // 资源加载状态
        let resourcesLoaded = false;
        const loadingProgress = { total: 0, loaded: 0 };
        
        // 粒子系统
        const particles = [];
        const particleContainer = new PIXI.Container();
        gridContainer.addChild(particleContainer);
        
        // 加载按钮纹理
        let playButtonUpTexture = null;
        let playButtonDownTexture = null;
        
        // 多点触摸追踪
        const activeTouches = new Map(); // pointerId -> { row, col, button }
        
        // 创建粒子效果
        function spawnParticles(x, y, color = 0xffffff) {
            const particleCount = 8;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = new PIXI.Graphics();
                
                // 绘制小圆点
                particle.beginFill(color);
                particle.drawCircle(0, 0, 3);
                particle.endFill();
                
                // 设置初始位置
                particle.x = x;
                particle.y = y;
                
                // 随机速度和方向
                const angle = (Math.PI * 2 / particleCount) * i + (Math.random() - 0.5);
                const speed = 2 + Math.random() * 3;
                particle.vx = Math.cos(angle) * speed;
                particle.vy = Math.sin(angle) * speed;
                
                // 生命周期
                particle.life = 1.0;
                particle.decay = 0.02 + Math.random() * 0.02;
                
                particleContainer.addChild(particle);
                particles.push(particle);
            }
        }
        
        // 更新粒子
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                
                // 更新位置
                particle.x += particle.vx;
                particle.y += particle.vy;
                
                // 衰减
                particle.life -= particle.decay;
                particle.alpha = particle.life;
                
                // 缩小
                particle.scale.set(particle.life);
                
                // 移除死亡粒子
                if (particle.life <= 0) {
                    particleContainer.removeChild(particle);
                    particle.destroy();
                    particles.splice(i, 1);
                }
            }
        }
        
        // 加载专辑封面
        async function loadAlbumCover() {
            try {
                // 尝试加载 pic.png 或 pic.jpg
                let coverPath = null;
                
                // 先尝试加载 png
                try {
                    const pngResponse = await fetch(`${songDirectory}pic.png`);
                    if (pngResponse.ok) {
                        coverPath = `${songDirectory}pic.png`;
                    }
                } catch (e) {
                    // 如果 png 不存在，尝试 jpg
                }
                
                // 如果 png 不存在，尝试 jpg
                if (!coverPath) {
                    try {
                        const jpgResponse = await fetch(`${songDirectory}pic.jpg`);
                        if (jpgResponse.ok) {
                            coverPath = `${songDirectory}pic.jpg`;
                        }
                    } catch (e) {
                        console.log('未找到专辑封面图片');
                        return;
                    }
                }
                
                if (!coverPath) {
                    console.log('未找到专辑封面图片');
                    return;
                }
                
                console.log(`加载专辑封面: ${coverPath}`);
                
                // 加载纹理
                const texture = await PIXI.Assets.load(coverPath);
                
                // 创建精灵
                albumCoverSprite = new PIXI.Sprite(texture);
                
                // 设置锚点为中心
                albumCoverSprite.anchor.set(0.5);
                
                // 调整大小以适应屏幕
                updateAlbumCoverSize();
                
                // 添加模糊滤镜
                const blurFilter = new PIXI.BlurFilter();
                blurFilter.blur = 5; // 模糊程度
                albumCoverSprite.filters = [blurFilter];
                // 降低cover亮度
                albumCoverSprite.tint = 0x999999; // 黑色乘法
                
                
                // 添加到最底层容器
                albumCoverContainer.addChild(albumCoverSprite);
                
                console.log('专辑封面加载成功');
                
            } catch (error) {
                console.error('加载专辑封面失败:', error);
            }
        }
        
        // 更新专辑封面大小
        function updateAlbumCoverSize() {
            if (!albumCoverSprite) return;
            
            // 让封面覆盖整个屏幕
            const screenWidth = app.screen.width;
            const screenHeight = app.screen.height;
            
            // 计算缩放比例，保持宽高比并覆盖整个屏幕
            const scaleX = screenWidth / albumCoverSprite.texture.width;
            const scaleY = screenHeight / albumCoverSprite.texture.height;
            const scale = Math.max(scaleX, scaleY);
            
            albumCoverSprite.scale.set(scale);
            albumCoverSprite.x = screenWidth / 2;
            albumCoverSprite.y = screenHeight / 2;
        }
        
        // 预加载所有资源
        async function preloadAllResources() {
            console.log('开始预加载资源...');
            
            const resourcesToLoad = [];
            
            // 1. 加载play_button图片
            resourcesToLoad.push(
                { alias: 'playButtonUp', src: './markers/play_button.png' },
                { alias: 'playButtonDown', src: './markers/play_button_down.png' }
            );
            
            // 2. 加载marker基础动画帧 (25帧)
            for (let frame = 1; frame <= totalFrames; frame++) {
                const frameNumber = String(frame).padStart(4, '0');
                resourcesToLoad.push({
                    alias: `markerBase${frame}`,
                    src: `${markerBasePath}base${frameNumber}.png`
                });
            }
            
            // 3. 加载touch_perfect动画帧 (15帧)
            for (let frame = 1; frame <= touchPerfectFrames; frame++) {
                const frameNumber = String(frame).padStart(4, '0');
                resourcesToLoad.push({
                    alias: `touchPerfect${frame}`,
                    src: `${touchPerfectPath}perfect${frameNumber}.png`
                });
            }
            
            // 4. 加载touch_great动画帧 (15帧)
            for (let frame = 1; frame <= 15; frame++) {
                const frameNumber = String(frame).padStart(4, '0');
                resourcesToLoad.push({
                    alias: `touchGreat${frame}`,
                    src: `${touchGreatPath}great${frameNumber}.png`
                });
            }
            
            // 5. 加载touch_good动画帧 (15帧)
            for (let frame = 1; frame <= 15; frame++) {
                const frameNumber = String(frame).padStart(4, '0');
                resourcesToLoad.push({
                    alias: `touchGood${frame}`,
                    src: `${touchGoodPath}good${frameNumber}.png`
                });
            }
            
            // 6. 加载touch_poor动画帧 (15帧)
            for (let frame = 1; frame <= 15; frame++) {
                const frameNumber = String(frame).padStart(4, '0');
                resourcesToLoad.push({
                    alias: `touchPoor${frame}`,
                    src: `${touchPoorPath}poor${frameNumber}.png`
                });
            }
            
            loadingProgress.total = resourcesToLoad.length;
            loadingProgress.loaded = 0;
            
            // 使用PIXI.Assets批量加载
            try {
                // 创建加载进度回调
                const loadProgress = (progress) => {
                    loadingProgress.loaded = Math.round(progress * loadingProgress.total);
                    const percent = Math.round(progress * 100);
                    console.log(`资源加载进度: ${percent}% (${loadingProgress.loaded}/${loadingProgress.total})`);
                    
                    // 更新UI显示
                    const loadingPercent = document.getElementById('loadingPercent');
                    if (loadingPercent) {
                        loadingPercent.textContent = `${percent}%`;
                    }
                };
                
                // 添加所有资源到Assets
                const loadPromises = resourcesToLoad.map(resource => 
                    PIXI.Assets.load({ alias: resource.alias, src: resource.src })
                );
                
                // 等待所有资源加载完成
                await Promise.all(loadPromises);
                
                console.log('所有资源加载完成!');
                
                // 加载专辑封面
                await loadAlbumCover();
                
                // 获取play_button纹理
                playButtonUpTexture = PIXI.Assets.get('playButtonUp');
                playButtonDownTexture = PIXI.Assets.get('playButtonDown');
                
                resourcesLoaded = true;
                
            } catch (error) {
                console.error('资源加载失败:', error);
                throw error;
            }
        }
        
        // 从缓存中获取纹理
        function getTextureFromCache(name) {
            try {
                return PIXI.Assets.get(name);
            } catch (e) {
                console.warn(`无法获取纹理: ${name}`);
                return null;
            }
        }
        
        // 创建4x4网格
        function createGrid() {
            // 如果资源还未加载完成，等待后再创建
            if (!resourcesLoaded) {
                console.warn('资源尚未加载完成，延迟创建网格');
                setTimeout(createGrid, 100);
                return;
            }
            
            // 保存所有note的引用
            const savedNotes = notes.length > 0 ? [...notes] : [];
            
            // 保存粒子容器（因为它在gridContainer中）
            const savedParticleContainer = particleContainer;
            
            // 保存Combo文本（如果存在）
            const savedComboText = comboText;
            const savedComboLabelText = comboLabelText;
            
            // 保存所有note的判定动画（如果存在）
            const savedTouchAnimations = [];
            savedNotes.forEach(note => {
                if (note.touchAnimation) {
                    savedTouchAnimations.push({
                        note: note,
                        animation: note.touchAnimation
                    });
                }
            });
            
            // 清除现有的图形
            gridContainer.removeChildren();
            
            // 重新添加粒子容器
            gridContainer.addChild(savedParticleContainer);
            
            // 重新添加Combo文本（如果存在）
            if (savedComboText && savedComboLabelText) {
                gridContainer.addChildAt(savedComboLabelText, 0);
                gridContainer.addChildAt(savedComboText, 1);
                // 更新位置以适应新的屏幕尺寸
                savedComboLabelText.x = app.screen.width / 2;
                savedComboLabelText.y = app.screen.height / 2 - 10;
                savedComboText.x = app.screen.width / 2;
                savedComboText.y = app.screen.height / 2 + 10;
            }
            
            // 重新添加判定动画（如果存在）
            savedTouchAnimations.forEach(item => {
                gridContainer.addChild(item.animation);
                // 更新位置和大小
                item.animation.x = item.note.col * cellSize;
                item.animation.y = item.note.row * cellSize;
                item.animation.width = cellSize;
                item.animation.height = cellSize;
                
                // 重新设置层级，放在button下层
                const buttonIndex = item.note.row * gridSize + item.note.col;
                const button = playButtons[buttonIndex];
                if (button && button.parent === gridContainer) {
                    const buttonChildIndex = gridContainer.getChildIndex(button);
                    gridContainer.setChildIndex(item.animation, buttonChildIndex - 1);
                }
            });
            
            // 网格占满整个画布
            cellSize = Math.floor(app.screen.width / gridSize);
            
            gridWidth = cellSize * gridSize;
            gridHeight = cellSize * gridSize;

            // 创建网格线
            for (let i = 0; i <= gridSize; i++) {
                // 垂直线
                const vLine = new PIXI.Graphics();
                vLine.lineStyle(2, 0xffffff, 1);
                vLine.moveTo(i * cellSize, 0);
                vLine.lineTo(i * cellSize, gridHeight);
                gridContainer.addChild(vLine);
                
                // 水平线
                const hLine = new PIXI.Graphics();
                hLine.lineStyle(2, 0xffffff, 1);
                hLine.moveTo(0, i * cellSize);
                hLine.lineTo(gridWidth, i * cellSize);
                gridContainer.addChild(hLine);
            }
            
            // 为每个单元格添加背景色（可选）
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const cell = new PIXI.Graphics();
                    // 黑色背景
                    cell.beginFill(0x000000, 0.5);
                    cell.drawRect(col * cellSize, row * cellSize, cellSize, cellSize);
                    cell.endFill();
                    gridContainer.addChildAt(cell, 0); // 放在底层
                }
            }
            
            // 更新所有note的位置和大小
            updateAllNotesPosition();
            
            // 如果有已存在的notes，重新添加到容器
            if (savedNotes.length > 0) {
                notes.length = 0; // 清空当前数组
                savedNotes.forEach(note => {
                    notes.push(note);
                    gridContainer.addChild(note.animation);
                    gridContainer.addChild(note.touchPerfectAnimation);
                });
                updateAllNotesPosition();
            }
            
            // 为每个格子添加play_button图片
            playButtons.length = 0; // 清空数组
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    try {
                        const button = new PIXI.Sprite(playButtonUpTexture);
                        button.anchor.set(0.5);
                        button.x = col * cellSize + cellSize / 2;
                        button.y = row * cellSize + cellSize / 2;
                        
                        // 占满整个格子
                        button.width = cellSize;
                        button.height = cellSize;
                        
                        // 添加交互事件
                        button.interactive = true;
                        button.buttonMode = true;
                        button.cursor = 'pointer';
                        const cellIndex = row * gridSize + col;
                        button._row = row; // 存储行号
                        button._col = col; // 存储列号
                        
                        // 按下事件
                        button.on('pointerdown', (event) => {
                            const pointerId = event.data.identifier || 0;
                            button.texture = playButtonDownTexture;
                            
                            // 记录触摸点
                            activeTouches.set(pointerId, { row, col, button });
                            
                            // 获取实际触摸位置
                            const localPos = event.data.getLocalPosition(gridContainer);
                            // spawnParticles(localPos.x, localPos.y, 0xffd700);
                            
                            // 如果未播放且点击的是有START HERE提示的格子，自动开始播放
                            if (!isPlaying && audioBuffer) {
                                const hasStartHere = startHereTexts.some(hint => hint.cellIndex === cellIndex);
                                if (hasStartHere) {
                                    // 尝试进入全屏模式
                                    enterFullscreen();
                                    
                                    // 如果AudioContext被挂起，先恢复
                                    if (audioContext && audioContext.state === 'suspended') {
                                        audioContext.resume();
                                    }
                                    playAudio();
                                }
                            }
                            
                            // 触发判定逻辑
                            handleTouch(cellIndex);
                        });
                        
                        // 释放事件
                        button.on('pointerup', (event) => {
                            const pointerId = event.data.identifier || 0;
                            button.texture = playButtonUpTexture;
                            activeTouches.delete(pointerId);
                        });
                        button.on('pointerupoutside', (event) => {
                            const pointerId = event.data.identifier || 0;
                            button.texture = playButtonUpTexture;
                            activeTouches.delete(pointerId);
                        });
                        
                        // 触摸离开按钮区域时不恢复状态，保持按下态直到pointerup
                        
                        gridContainer.addChild(button);
                        playButtons.push(button);
                    } catch (e) {
                        console.log('加载play_button失败:', e);
                    }
                }
            }
            
            // 为整个gridContainer添加全局触摸移动事件
            gridContainer.interactive = true;
            gridContainer.on('pointermove', (event) => {
                const pointerId = event.data.identifier || 0;
                const localPos = event.data.getLocalPosition(gridContainer);
                
                // 计算当前触摸点在哪个格子
                const col = Math.floor(localPos.x / cellSize);
                const row = Math.floor(localPos.y / cellSize);
                
                // 检查是否在有效范围内
                if (col < 0 || col >= gridSize || row < 0 || row >= gridSize) return;
                
                const currentCellIndex = row * gridSize + col;
                const touchInfo = activeTouches.get(pointerId);
                
                // 如果是新的格子，切换按钮状态
                if (touchInfo && (touchInfo.row !== row || touchInfo.col !== col)) {
                    // 不要恢复旧按钮状态！让旧按钮保持按下状态以支持多点触控
                    
                    // 设置新按钮状态
                    const newButton = playButtons[currentCellIndex];
                    if (newButton) {
                        newButton.texture = playButtonDownTexture;
                        
                        // 更新触摸追踪
                        activeTouches.set(pointerId, { row, col, button: newButton });
                        
                        // spawnParticles(localPos.x, localPos.y, 0xffd700);
                        
                        // 触发判定逻辑
                        handleTouch(currentCellIndex);
                    }
                }
            });
            
            // 确保play_button在所有note之上（但不包括粒子容器）
            const maxIndex = gridContainer.children.length - 1; // particleContainer的索引
            playButtons.forEach((button, index) => {
                gridContainer.setChildIndex(button, maxIndex - playButtons.length + index);
            });
            
            // 确保粒子容器在最顶层
            gridContainer.setChildIndex(particleContainer, gridContainer.children.length - 1);
            
            // 更新Start Here提示（也在顶层）
            updateStartHereHints();
        }

        // 更新Combo显示
        function updateComboDisplay() {
            if (!comboText || !comboLabelText) return;
            
            if (combo > 0) {
                comboText.text = combo.toString();
                comboText.visible = true;
                comboText.alpha = Math.min(1, comboText.alpha + 0.1);
                
                comboLabelText.visible = true;
                comboLabelText.alpha = Math.min(1, comboLabelText.alpha + 0.1);
                
                // 检测combo是否增加
                if (combo > lastCombo) {
                    // Combo增加时，放大到1.3倍
                    comboText.scale.set(1.3);
                    lastCombo = combo;
                } else {
                    // 逐渐缩小到正常大小
                    const currentScale = comboText.scale.x;
                    if (currentScale > 1.0) {
                        const newScale = Math.max(1.0, currentScale - 0.05);
                        comboText.scale.set(newScale);
                    }
                }
            } else {
                comboText.alpha = Math.max(0, comboText.alpha - 0.1);
                comboLabelText.alpha = Math.max(0, comboLabelText.alpha - 0.1);
                
                if (comboText.alpha <= 0) {
                    comboText.visible = false;
                    comboLabelText.visible = false;
                }
                
                // 重置combo时，也重置lastCombo
                if (combo === 0) {
                    lastCombo = 0;
                    comboText.scale.set(1);
                }
            }
        }

        // 计算并更新分数
        function updateScore() {
            const totalNotes = chartData.length;
            if (totalNotes === 0) {
                score = 0;
            } else {
                // 分数计算公式：（PERFECT數+GREAT數×70%+GOOD數×40%+POOR數×10%）÷總note數×1000000
                const weightedSum = stats.perfect + 
                                   stats.great * 0.7 + 
                                   stats.good * 0.4 + 
                                   stats.poor * 0.1;
                score = Math.floor((weightedSum / totalNotes) * 1000000);
            }
            
            // 格式化分数显示（添加千位分隔符）
            const scoreElement = document.getElementById('scoreDisplay');
            if (scoreElement) {
                scoreElement.textContent = score.toLocaleString();
            }
        }
        
        // 根据分数计算等级
        function calculateGrade(score) {
            if (score >= 1000000) return 'EXCELLENT';
            if (score >= 980000) return 'SSS';
            if (score >= 950000) return 'SS';
            if (score >= 900000) return 'S';
            if (score >= 850000) return 'A';
            if (score >= 800000) return 'B';
            if (score >= 700000) return 'C';
            if (score >= 500000) return 'D';
            return 'E';
        }
        
        // 获取等级的颜色
        function getGradeColor(grade) {
            switch(grade) {
                case 'EXCELLENT': return '#FFD700'; // 金色
                case 'SSS': return '#FF69B4'; // 粉色
                case 'SS': return '#FF4500'; // 橙红色
                case 'S': return '#FFD700'; // 金色
                case 'A': return '#32CD32'; // 绿色
                case 'B': return '#00BFFF'; // 蓝色
                case 'C': return '#FFFF00'; // 黄色
                case 'D': return '#FFA500'; // 橙色
                case 'E': return '#808080'; // 灰色
                default: return '#FFFFFF';
            }
        }

        // 解析谱面文件
        async function loadChart() {
            try {
                const response = await fetch(chartPath);
                const text = await response.text();
                const lines = text.split('\n');
                
                chartData = [];
                
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('#')) {
                        // 格式: #格子编号.毫秒数
                        const content = trimmed.substring(1);
                        const dotIndex = content.indexOf('.');
                        
                        if (dotIndex !== -1) {
                            const cellNumber = parseInt(content.substring(0, dotIndex));
                            const timeMs = parseInt(content.substring(dotIndex + 1));
                            
                            // 将格子编号转换为行列 (1-16 -> 0-15)
                            const cellIndex = cellNumber - 1;
                            const row = Math.floor(cellIndex / 4);
                            const col = cellIndex % 4;
                            
                            chartData.push({
                                cellIndex: cellIndex,
                                row: row,
                                col: col,
                                time: timeMs
                            });
                        }
                    }
                }
                
                // 按时间排序
                chartData.sort((a, b) => a.time - b.time);
                
                console.log(`谱面加载成功，共 ${chartData.length} 个note`);
                
                // 初始化所有格子的note
                initNotes();
                
            } catch (error) {
                console.error('谱面加载失败:', error);
            }
        }
        
        // 初始化所有格子的note对象
        function initNotes() {
            // 如果资源还未加载完成，等待后再初始化
            if (!resourcesLoaded) {
                console.warn('资源尚未加载完成，延迟初始化notes');
                setTimeout(initNotes, 100);
                return;
            }
            
            for (let i = 0; i < totalCells; i++) {
                const row = Math.floor(i / 4);
                const col = i % 4;
                
                // 使用预加载的纹理创建帧动画
                const textures = [];
                for (let frame = 1; frame <= totalFrames; frame++) {
                    const textureName = `markerBase${frame}`;
                    const texture = getTextureFromCache(textureName);
                    if (texture) {
                        textures.push(texture);
                    }
                }
                
                const animation = new PIXI.AnimatedSprite(textures);
                animation.animationSpeed = 0;
                animation.loop = false;
                animation.visible = false;
                animation.gotoAndStop(0);
                
                // 使用预加载的touch_perfect纹理
                const touchPerfectTextures = [];
                for (let frame = 1; frame <= touchPerfectFrames; frame++) {
                    const textureName = `touchPerfect${frame}`;
                    const texture = getTextureFromCache(textureName);
                    if (texture) {
                        touchPerfectTextures.push(texture);
                    }
                }
                
                const touchPerfectAnimation = new PIXI.AnimatedSprite(touchPerfectTextures);
                touchPerfectAnimation.animationSpeed = 0.8;
                touchPerfectAnimation.loop = false;
                touchPerfectAnimation.visible = false;
                touchPerfectAnimation.gotoAndStop(0);
                
                notes.push({
                    animation: animation,
                    touchPerfectAnimation: touchPerfectAnimation,
                    cellIndex: i,
                    row: row,
                    col: col,
                    currentFrame: 0,
                    isActive: false,
                    startTime: 0,
                    isTouching: false
                });
                
                gridContainer.addChild(animation);
                gridContainer.addChild(touchPerfectAnimation);
                
                // 添加交互事件
                animation.interactive = true;
                animation.buttonMode = true;
                animation.cursor = 'pointer';
                
                // 触摸/点击事件
                animation.on('pointerdown', () => handleTouch(i));
            }
            
            // 创建Start Here提示文本
            createStartHereHints();
            
            // 更新所有note的位置
            updateAllNotesPosition();
        }
        
        // 创建Start Here提示
        function createStartHereHints() {
            // 清除旧的提示
            startHereTexts.forEach(text => {
                if (text.parent) {
                    text.parent.removeChild(text);
                }
            });
            startHereTexts = [];
            
            if (chartData.length === 0) return;
            
            // 找到最早的note时间
            const sortedNotes = [...chartData].sort((a, b) => a.time - b.time);
            const earliestTime = sortedNotes[0].time;
            
            // 只找出时间完全等于最早时间的note（同时出现的）
            const simultaneousNotes = sortedNotes.filter(n => n.time === earliestTime);
            
            console.log(`最早的note时间: ${earliestTime}ms, 同时出现的note数量: ${simultaneousNotes.length}`);
            
            // 为这些同时出现的note的格子创建提示
            simultaneousNotes.forEach(note => {
                const text = new PIXI.Text('START HERE', {
                    fontFamily: 'Arial',
                    fontSize: 16,
                    fontWeight: 'bold',
                    fill: 0xffff00,
                    stroke: 0x000000,
                    strokeThickness: 3,
                    align: 'center'
                });
                text.anchor.set(0.5);
                text.visible = false;
                gridContainer.addChild(text);
                
                startHereTexts.push({
                    text: text,
                    cellIndex: note.cellIndex,
                    row: note.row,
                    col: note.col,
                    firstNoteTime: note.time
                });
            });
        }
        
        // 更新Start Here提示位置和可见性
        function updateStartHereHints() {
            if (startHereTexts.length === 0) return;
            
            const currentTime = isPlaying && audioContext ? getCurrentTime() * 1000 : 0; // 转换为毫秒
            
            startHereTexts.forEach(hint => {
                // 更新位置
                hint.text.x = hint.col * cellSize + cellSize / 2;
                hint.text.y = hint.row * cellSize + cellSize / 2;
                
                // 判断是否应该显示：在当前时间之前且距离note还有至少800ms
                const timeToNote = hint.firstNoteTime - currentTime;
                
                if (timeToNote > 800 && timeToNote < 3000) {
                    // 在note出现前800ms到3000ms之间显示
                    hint.text.visible = true;
                    // 根据距离调整透明度
                    const alpha = Math.min(1, timeToNote / 2000);
                    hint.text.alpha = alpha;
                } else if (timeToNote >= 3000) {
                    // 距离还很远，显示但完全透明
                    hint.text.visible = true;
                    hint.text.alpha = 0;
                } else {
                    // note已经出现或即将出现，隐藏
                    hint.text.visible = false;
                }
            });
        }
        
        // 更新所有note的位置和大小
        function updateAllNotesPosition() {
            notes.forEach(note => {
                const animSize = cellSize;
                note.animation.width = animSize;
                note.animation.height = animSize;
                note.animation.x = note.col * cellSize;
                note.animation.y = note.row * cellSize;
                
                // touch_perfect动画也需要同样的位置和大小
                note.touchPerfectAnimation.width = animSize;
                note.touchPerfectAnimation.height = animSize;
                note.touchPerfectAnimation.x = note.col * cellSize;
                note.touchPerfectAnimation.y = note.row * cellSize;
            });
            
            // 更新play_button位置
            playButtons.forEach((button, index) => {
                const row = Math.floor(index / gridSize);
                const col = index % gridSize;
                button.x = col * cellSize + cellSize / 2;
                button.y = row * cellSize + cellSize / 2;
                
                // 占满整个格子
                button.width = cellSize;
                button.height = cellSize;
                
                // 确保play_button始终在最顶层（只在按钮已添加到容器时设置）
                if (button.parent === gridContainer) {
                    gridContainer.setChildIndex(button, gridContainer.children.length - 1);
                }
            });
            
            // 也确保Start Here提示在顶层（只在文本已添加到容器时设置）
            startHereTexts.forEach(hint => {
                if (hint.text && hint.text.parent === gridContainer) {
                    gridContainer.setChildIndex(hint.text, gridContainer.children.length - 1);
                }
            });
        }
        
        // 处理触摸/点击事件
        function handleTouch(cellIndex) {
            if (!isPlaying || !audioContext) return;
            
            const currentTime = getCurrentTime() * 1000; // 转换为毫秒
            const note = notes[cellIndex];
            
            // 如果该格子正在播放touch动画，不允许再次触发
            if (note.isTouching) return;
            
            // 查找该格子最近的未被判定的note
            const cellNotes = chartData.filter(n => n.cellIndex === cellIndex);
            if (cellNotes.length === 0) return;
            
            // 找到最近的未被判定的note
            let closestNote = null;
            let minTimeDiff = Infinity;
            let closestNoteIndex = -1;
            
            for (let i = 0; i < cellNotes.length; i++) {
                const noteData = cellNotes[i];
                // 创建唯一标识符：cellIndex + time
                const noteKey = `${noteData.cellIndex}_${noteData.time}`;
                
                // 跳过已经判定过的note
                if (judgedNotes.has(noteKey)) continue;
                
                const timeDiff = Math.abs(currentTime - noteData.time);
                if (timeDiff < minTimeDiff) {
                    minTimeDiff = timeDiff;
                    closestNote = noteData;
                    closestNoteIndex = i;
                }
            }
            
            if (!closestNote) return;
            
            // 计算当前应该显示的帧
            const frameDuration = 1000 / 30; // 30fps
            const preDisplayFrames = 16;
            const timeDiff = currentTime - closestNote.time;
            
            let currentFrameIndex = -1;
            
            // 如果在预显示范围内
            if (timeDiff >= -(preDisplayFrames * frameDuration) && timeDiff < 0) {
                currentFrameIndex = Math.floor((preDisplayFrames * frameDuration + timeDiff) / frameDuration);
            }
            // 如果在命中点或后续显示范围内
            else if (timeDiff >= 0) {
                currentFrameIndex = Math.floor(timeDiff / frameDuration) + preDisplayFrames;
            }
            
            // 判定逻辑（按优先级：Perfect > Great > Good > Poor）
            let judgment = null;
            
            if (currentFrameIndex >= perfectWindowStart && currentFrameIndex <= perfectWindowEnd) {
                // Perfect
                judgment = 'perfect';
            } else {
                // 检查Great
                for (const window of greatWindows) {
                    if (currentFrameIndex >= window.start && currentFrameIndex <= window.end) {
                        judgment = 'great';
                        break;
                    }
                }
                
                if (!judgment) {
                    // 检查Good
                    for (const window of goodWindows) {
                        if (currentFrameIndex >= window.start && currentFrameIndex <= window.end) {
                            judgment = 'good';
                            break;
                        }
                    }
                }
                
                if (!judgment) {
                    // 检查Poor
                    for (const window of poorWindows) {
                        if (currentFrameIndex >= window.start && currentFrameIndex <= window.end) {
                            judgment = 'poor';
                            break;
                        }
                    }
                }
            }
            
            // 如果有判定结果，触发动画并标记为已判定
            if (judgment) {
                // 标记该note为已判定
                const noteKey = `${closestNote.cellIndex}_${closestNote.time}`;
                judgedNotes.add(noteKey);
                
                // 更新combo和统计
                if (judgment === 'poor') {
                    // Poor打断combo
                    combo = 0;
                    stats.poor++;
                } else {
                    // Perfect/Great/Good增加combo
                    combo++;
                    if (combo > maxCombo) {
                        maxCombo = combo;
                    }
                    stats[judgment]++;
                }
                
                // 添加判定标记到进度条（只标记Miss/Poor/Good/Great）
                if (judgment !== 'perfect') {
                    addJudgmentMark(judgment, closestNote.time);
                }
                
                // 更新显示
                updateStatsDisplay();
                updateComboDisplay();
                
                // 触发判定动画
                triggerTouchAnimation(note, judgment);
                console.log(`${judgment.charAt(0).toUpperCase() + judgment.slice(1)}! Cell ${cellIndex + 1}, Frame ${currentFrameIndex + 1}, Time: ${closestNote.time}ms, Combo: ${combo}`);
            }
        }
        
        // 触发touch判定动画
        function triggerTouchAnimation(note, judgment) {
            // 根据判定类型选择动画路径和前缀
            let texturePrefix;
            switch(judgment) {
                case 'perfect':
                    texturePrefix = 'touchPerfect';
                    break;
                case 'great':
                    texturePrefix = 'touchGreat';
                    break;
                case 'good':
                    texturePrefix = 'touchGood';
                    break;
                case 'poor':
                    texturePrefix = 'touchPoor';
                    break;
                default:
                    return;
            }
            
            // 如果动画对象不存在，使用预加载的纹理创建它
            if (!note.touchAnimation) {
                const touchTextures = [];
                for (let frame = 1; frame <= 15; frame++) {
                    const textureName = `${texturePrefix}${frame}`;
                    const texture = getTextureFromCache(textureName);
                    if (texture) {
                        touchTextures.push(texture);
                    }
                }
                
                if (touchTextures.length === 0) {
                    console.warn(`无法找到${judgment}判定的纹理`);
                    return;
                }
                
                note.touchAnimation = new PIXI.AnimatedSprite(touchTextures);
                note.touchAnimation.animationSpeed = 1.0; // 正常速度播放
                note.touchAnimation.loop = false;
                note.touchAnimation.visible = false;
                note.touchAnimation.gotoAndStop(0);
                
                // 添加动画完成事件监听
                note.touchAnimation.onComplete = () => {
                    // 动画播放完成后，短暂停留在最后一帧后立即隐藏
                    setTimeout(() => {
                        note.touchAnimation.visible = false;
                        note.touchAnimation.stop();
                        note.isTouching = false;
                    }, 50); // 最后一帧只停留50ms
                };
                
                // 将判定动画添加到gridContainer，并放在button下层
                gridContainer.addChild(note.touchAnimation);
                
                // 找到对应的button，将判定动画放在button下面
                const buttonIndex = note.row * gridSize + note.col;
                const button = playButtons[buttonIndex];
                if (button && button.parent === gridContainer) {
                    const buttonChildIndex = gridContainer.getChildIndex(button);
                    // 将判定动画放在button的前面（下层）
                    gridContainer.setChildIndex(note.touchAnimation, buttonChildIndex - 1);
                }
            }
            
            // 设置位置和大小（占满整个格子）
            note.touchAnimation.x = note.col * cellSize;
            note.touchAnimation.y = note.row * cellSize;
            note.touchAnimation.width = cellSize;
            note.touchAnimation.height = cellSize;
            
            // 立即隐藏并停止base动画，防止与判定动画重叠
            note.animation.visible = false;
            note.animation.stop();
            
            // 重置并播放判定动画
            note.touchAnimation.gotoAndStop(0);
            note.touchAnimation.visible = true;
            note.touchAnimation.play();
            note.isTouching = true;
        }
        
        // 根据当前音频时间更新所有note的帧
        function updateNotes(currentTimeMs) {
            notes.forEach((note, index) => {
                // 查找该格子的所有note
                const cellNotes = chartData.filter(n => n.cellIndex === index);
                
                if (cellNotes.length > 0) {
                    let shouldShow = false;
                    let frameIndex = 0;
                    
                    // 按照30fps计算，每帧约33.33ms
                    const frameDuration = 1000 / 30; // 约33.33ms每帧
                    const preDisplayFrames = 16; // 提前16帧开始显示
                    const preDisplayTime = preDisplayFrames * frameDuration; // 约533ms
                    const totalAnimFrames = 25; // 总共25帧
                    const postDisplayFrames = totalAnimFrames - preDisplayFrames; // 后续9帧
                    const postDisplayTime = postDisplayFrames * frameDuration; // 约300ms
                    
                    // 遍历该格子的所有note，找到当前应该显示的帧
                    for (const noteData of cellNotes) {
                        const timeDiff = currentTimeMs - noteData.time;
                        const noteKey = `${noteData.cellIndex}_${noteData.time}`;
                        
                        // 检查是否已经错过（超过显示范围且未被判定）
                        if (timeDiff >= postDisplayTime && !judgedNotes.has(noteKey)) {
                            // Miss：note已经超过显示范围但未被判定
                            judgedNotes.add(noteKey);
                            stats.miss++;
                            combo = 0; // Miss打断combo
                            
                            // 添加Miss标记到进度条
                            addJudgmentMark('miss', noteData.time);
                            
                            updateStatsDisplay();
                            updateComboDisplay();
                            console.log(`Miss! Cell ${index + 1}, Time: ${noteData.time}ms`);
                            continue;
                        }
                        
                        // 如果在预显示范围内（前267ms）
                        if (timeDiff >= -preDisplayTime && timeDiff < 0) {
                            shouldShow = true;
                            // 计算帧索引：从0到15
                            frameIndex = Math.floor((preDisplayTime + timeDiff) / frameDuration);
                            frameIndex = Math.max(0, Math.min(preDisplayFrames - 1, frameIndex));
                            break;
                        }
                        // 如果在命中点或后续显示范围内（0到150ms）
                        else if (timeDiff >= 0 && timeDiff < postDisplayTime) {
                            shouldShow = true;
                            // 计算帧索引：从16到24
                            frameIndex = Math.floor(timeDiff / frameDuration) + preDisplayFrames;
                            frameIndex = Math.max(preDisplayFrames, Math.min(totalAnimFrames - 1, frameIndex));
                            break;
                        }
                    }
                    
                    if (shouldShow && frameIndex >= 0 && frameIndex < totalAnimFrames) {
                        note.animation.visible = true;
                        note.animation.gotoAndStop(frameIndex);
                    } else {
                        note.animation.visible = false;
                    }
                } else {
                    // 该格子没有任何note
                    note.animation.visible = false;
                }
            });
        }

        // 初始化Web Audio API
        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            loadAudio();
        }
        
        // 加载音频文件
        async function loadAudio() {
            try {
                const response = await fetch(songPath);
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                console.log('音频加载成功');
            } catch (error) {
                console.error('音频加载失败:', error);
            }
        }
        
        // 播放音频
        function playAudio() {
            if (!audioBuffer) {
                console.log('音频未加载');
                return;
            }
            
            // 如果正在播放，先暂停
            if (isPlaying && audioSource) {
                pauseTime = audioContext.currentTime - startTime;
                try {
                    audioSource.stop();
                } catch (e) {
                    // 忽略错误
                }
                audioSource = null;
                isPlaying = false;
                updatePlayButton();
                return;
            }
            
            // 检查是否是从头开始播放（pauseTime为0）
            const isFreshStart = pauseTime === 0;
            
            // 创建新的音源
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(audioContext.destination);
            
            // 从暂停位置开始播放
            const offset = pauseTime % audioBuffer.duration;
            audioSource.start(0, offset);
            startTime = audioContext.currentTime - offset;
            
            // 只有从头开始播放时才重置统计和清除标记
            if (isFreshStart) {
                // 重置统计
                resetStats();
                
                // 清除所有判定标记
                clearJudgmentMarks();
            }
            
            // 创建Combo文本
            createComboText();
            
            audioSource.onended = () => {
                if (isPlaying) {
                    isPlaying = false;
                    pauseTime = 0;
                    audioSource = null;
                    updatePlayButton();
                    // 隐藏进度条
                    domProgressContainer.style.display = 'none';
                    progressBarFill.style.width = '0%';
                    
                    // 显示游戏结果
                    showResult();
                }
            };
            
            isPlaying = true;
            updatePlayButton();
        }
        
        // 停止音频（完全停止，重置到开头）
        function stopAudio() {
            if (audioSource) {
                try {
                    audioSource.stop();
                } catch (e) {
                    // 忽略错误
                }
                audioSource = null;
            }
            
            isPlaying = false;
            pauseTime = 0;
            updatePlayButton();
        }
        
        // 获取当前播放时间
        function getCurrentTime() {
            if (isPlaying && audioContext) {
                return audioContext.currentTime - startTime;
            }
            return pauseTime;
        }
        
        // 更新播放按钮状态
        function updatePlayButton() {
            const button = document.getElementById('playButton');
            if (button) {
                button.textContent = isPlaying ? '⏸️' : '▶️';
            }
        }
        
        // 重玩功能
        function replay() {
            // 停止当前播放
            if (isPlaying && audioSource) {
                try {
                    audioSource.stop();
                } catch (e) {
                    // 忽略错误
                }
                audioSource = null;
            }
            
            // 重置所有状态
            isPlaying = false;
            pauseTime = 0;
            
            // 重置统计
            resetStats();
            
            // 清除判定标记
            clearJudgmentMarks();
            
            // 清除已判定的note集合
            judgedNotes.clear();
            
            // 隐藏进度条（重玩后会重新显示）
            domProgressContainer.style.display = 'none';
            
            // 更新按钮状态
            updatePlayButton();
            
            console.log('游戏已重置，可以重新开始');
            
            // 自动开始播放
            setTimeout(() => {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                enterFullscreen();
                playAudio();
            }, 100); // 短暂延迟确保重置完成
        }
        
        // 绑定播放按钮事件
        document.addEventListener('DOMContentLoaded', () => {
            // 播放/暂停按钮
            const playButton = document.getElementById('playButton');
            if (playButton) {
                playButton.addEventListener('click', () => {
                    // 首次点击时恢复AudioContext（浏览器策略要求）
                    if (audioContext && audioContext.state === 'suspended') {
                        audioContext.resume();
                    }
                    
                    // 尝试进入全屏模式
                    enterFullscreen();
                    
                    playAudio();
                });
            }
            
            // 重玩按钮
            const replayButton = document.getElementById('replayButton');
            if (replayButton) {
                replayButton.addEventListener('click', () => {
                    replay();
                });
            }
            
            // 返回按钮
            const backButton = document.getElementById('backButton');
            if (backButton) {
                backButton.addEventListener('click', () => {
                    // 停止音频播放
                    stopAudio();
                    
                    // 退出全屏（如果在全屏模式）
                    if (document.fullscreenElement) {
                        document.exitFullscreen().catch(err => {
                            console.log('退出全屏失败:', err);
                        });
                    }
                    
                    // 返回上一页
                    window.history.back();
                });
            }
        });
        
        // 全屏功能
        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.log('全屏请求被拒绝或失败:', err);
                });
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }


        // 定位网格使其居底
        // 初始创建网格
        createGrid();
        
        // 动画循环 - 同步帧动画和音频
        app.ticker.add(() => {

            updateStartHereHints();

        // 窗口大小改变时重新调整
        let resizeTimeout;
        function handleResize() {

        window.addEventListener('resize', handleResize);
        
        // 移除之前多余的 checkWindowSize 逻辑，避免与 resize 事件冲突导致元素丢失
        
        // 解析URL参数（必须在initAudio和loadChart之前）
        parseURLParams();
        
        // 预加载所有资源，然后初始化游戏
        async function initializeGame() {

        // 启动游戏初始化
        initializeGame();
        
        // DOM进度条相关元素
        const domProgressContainer = document.getElementById('progressContainer');
        const progressBarWrapper = document.getElementById('progressBarWrapper');
        const progressBarFill = document.getElementById('progressBarFill');
        const judgmentMarksContainer = document.getElementById('judgmentMarks');
        
        // 立即显示进度条（在加载完成后）
        domProgressContainer.style.display = 'flex';
        
        // 添加判定标记到进度条
        function addJudgmentMark(judgment, noteTime) {
            if (!audioBuffer || !judgmentMarksContainer) return;
            
            const duration = audioBuffer.duration;
            const progress = noteTime / (duration * 1000); // 转换为秒
            const clampedProgress = Math.max(0, Math.min(1, progress));
            
            const mark = document.createElement('div');
            mark.className = `judgment-mark mark-${judgment}`;
            
            const isLandscape = window.innerWidth > window.innerHeight;
            if (isLandscape) {
                // 横屏模式：根据高度定位（从下往上）
                mark.style.bottom = (clampedProgress * 100) + '%';
            } else {
                // 竖屏模式：根据宽度定位（从左往右）
                mark.style.left = (clampedProgress * 100) + '%';
            }
            
            judgmentMarksContainer.appendChild(mark);
        }
        
        // 清除所有判定标记
        function clearJudgmentMarks() {
            if (judgmentMarksContainer) {
                judgmentMarksContainer.innerHTML = '';
            }
        }
        
        // 更新DOM进度条
        function updateProgress() {
            if (!isPlaying || !audioBuffer) return;
            
            const currentTime = getCurrentTime();
            const duration = audioBuffer.duration;
            const progress = Math.min(currentTime / duration, 1);
            const percent = progress * 100;
            
            // 检测当前是横屏还是竖屏
            const isLandscape = window.innerWidth > window.innerHeight;
            
            if (isLandscape) {
                // 横屏模式：更新高度（从下往上）
                progressBarFill.style.height = percent + '%';
                progressBarFill.style.width = '100%';
            } else {
                // 竖屏模式：更新宽度（从左往右）
                progressBarFill.style.width = percent + '%';
                progressBarFill.style.height = '100%';
            }
        }
        
        // 进度条点击事件
        progressBarWrapper.addEventListener('click', (e) => {
            if (!audioBuffer) {
                console.log('音频未加载');
                return;
            }
            
            const rect = progressBarWrapper.getBoundingClientRect();
            const isLandscape = window.innerWidth > window.innerHeight;
            let progress;
            
            if (isLandscape) {
                // 横屏模式：根据Y轴计算（从下往上）
                // rect.bottom是底部坐标，e.clientY是点击位置的Y坐标
                // 从底部开始的距离 = rect.bottom - e.clientY
                const clickY = rect.bottom - e.clientY;
                progress = clickY / rect.height;
                console.log('横屏点击:', { 
                    rectBottom: rect.bottom, 
                    clientY: e.clientY, 
                    clickY: clickY, 
                    height: rect.height,
                    progress: progress 
                });
            } else {
                // 竖屏模式：根据X轴计算（从左往右）
                const clickX = e.clientX - rect.left;
                progress = clickX / rect.width;
            }
            
            const clampedProgress = Math.max(0, Math.min(1, progress));
            
            const duration = audioBuffer.duration;
            const newTime = duration * clampedProgress;
            
            console.log('点击进度条:', {
                progress: clampedProgress,
                newTime: newTime,
                wasPlaying: isPlaying,
                currentPauseTime: pauseTime
            });
            
            // 如果正在播放，停止当前音源
            if (isPlaying && audioSource) {
                try {
                    audioSource.stop();
                } catch (e) {
                    console.log('停止音源错误:', e);
                }
                audioSource = null;
                isPlaying = false; // 重要：重置播放状态
            }
            
            // 设置新的播放位置
            pauseTime = newTime;
            console.log('设置pauseTime为:', pauseTime);
            
            // 点击进度条后自动开始播放
            if (!isPlaying) {
                // 如果AudioContext被挂起，先恢复
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                playAudio();
            } else {
                // 如果已经在播放，重新开始播放
                playAudio();
            }
        });
    </script>
</body>
