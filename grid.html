<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixi.js 4x4 方格</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #2c3e50;
            position: relative;
            height: 100vh;
            width: 100vw;
        }
        
        /* Pixi画布容器 */
        #pixiContainer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vmin;
            height: 100vmin;
        }
        
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        
        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
        }
        .play-button {
            padding: 8px 20px;
            font-size: 14px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .play-button:hover {
            background-color: #2980b9;
        }
        .play-button:active {
            background-color: #21618c;
        }
        
        /* 进度条样式 */
        .progress-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .progress-bar-wrapper {
            width: 60vw;
            max-width: 800px;
            height: 8px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        
        .progress-bar-fill {
            height: 100%;
            background-color: rgba(52, 152, 219, 0.8);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-time {
            color: white;
            font-size: 12px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="pixiContainer">
        <!-- Pixi画布将在这里创建 -->
    </div>
    
    <div class="controls">
        <button id="playButton" class="play-button">播放</button>
    </div>
    
    <div class="progress-container" id="progressContainer" style="display: none;">
        <div class="progress-bar-wrapper" id="progressBarWrapper">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="progress-time" id="progressTime">0:00 / 0:00</div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script>
        // 获取容器
        const pixiContainer = document.getElementById('pixiContainer');
        
        // 计算容器大小（1:1比例）
        function getContainerSize() {
            const minDimension = Math.min(window.innerWidth, window.innerHeight);
            return { width: minDimension, height: minDimension };
        }
        
        const containerSize = getContainerSize();
        
        // 初始化Pixi应用
        const app = new PIXI.Application({
            width: containerSize.width,
            height: containerSize.height,
            backgroundColor: 0x2c3e50,
            antialias: true,
            autoDensity: true,
            resolution: window.devicePixelRatio || 1
        });
        
        pixiContainer.appendChild(app.view);

        // 创建容器用于放置4x4网格
        const gridContainer = new PIXI.Container();
        app.stage.addChild(gridContainer);

        // 定义网格参数
        const gridSize = 4;
        let cellSize = 0;
        let gridWidth = 0;
        let gridHeight = 0;
        
        // 帧动画相关变量
        const markerBasePath = './markers/thundergate/marker_base/';
        const touchPerfectPath = './markers/thundergate/touch_perfect/';
        const totalFrames = 25;
        const touchPerfectFrames = 15;
        
        // 音频相关变量
        let audioContext = null;
        let audioBuffer = null;
        let audioSource = null;
        let isPlaying = false;
        let startTime = 0;
        let pauseTime = 0;
        let songPath = './songs/Evans/song.mp3'; // 默认值
        
        // 谱面数据
        let chartData = [];
        let chartPath = './songs/Evans/pt_ext.jmt'; // 默认值
        
        // 从 URL 参数获取曲目和难度
        function parseURLParams() {
            const params = new URLSearchParams(window.location.search);
            const song = params.get('song');
            const difficulty = params.get('difficulty');
            const chart = params.get('chart');
            
            if (song && chart) {
                songPath = `./songs/${song}/song.mp3`;
                chartPath = `./songs/${song}/${chart}`;
                console.log(`加载曲目: ${song}, 难度: ${difficulty}, 谱面: ${chart}`);
                console.log(`歌曲路径: ${songPath}`);
                console.log(`谱面路径: ${chartPath}`);
            } else {
                console.log('未检测到URL参数，使用默认配置');
            }
        }
        
        // Note对象数组，每个格子一个
        const notes = [];
        const totalCells = 16; // 4x4网格
        
        // 判定窗口：base0016~18（帧索引15~17）
        const perfectWindowStart = 15; // base0016
        const perfectWindowEnd = 17;   // base0018
        
        // Start Here提示文本
        let startHereTexts = [];

        // 创建4x4网格
        function createGrid() {
            // 保存所有note的引用
            const savedNotes = notes.length > 0 ? [...notes] : [];
            
            // 清除现有的图形
            gridContainer.removeChildren();
            
            // 网格占满整个画布
            cellSize = Math.floor(app.screen.width / gridSize);
            
            gridWidth = cellSize * gridSize;
            gridHeight = cellSize * gridSize;

            // 创建网格线
            for (let i = 0; i <= gridSize; i++) {
                // 垂直线
                const vLine = new PIXI.Graphics();
                vLine.lineStyle(2, 0xffffff, 1);
                vLine.moveTo(i * cellSize, 0);
                vLine.lineTo(i * cellSize, gridHeight);
                gridContainer.addChild(vLine);
                
                // 水平线
                const hLine = new PIXI.Graphics();
                hLine.lineStyle(2, 0xffffff, 1);
                hLine.moveTo(0, i * cellSize);
                hLine.lineTo(gridWidth, i * cellSize);
                gridContainer.addChild(hLine);
            }
            
            // 为每个单元格添加背景色（可选）
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const cell = new PIXI.Graphics();
                    // 交替颜色
                    const color = (row + col) % 2 === 0 ? 0x3498db : 0x2980b9;
                    cell.beginFill(color, 0.7);
                    cell.drawRect(col * cellSize, row * cellSize, cellSize, cellSize);
                    cell.endFill();
                    gridContainer.addChildAt(cell, 0); // 放在底层
                }
            }
            
            // 更新所有note的位置和大小
            updateAllNotesPosition();
            
            // 如果有已存在的notes，重新添加到容器
            if (savedNotes.length > 0) {
                notes.length = 0; // 清空当前数组
                savedNotes.forEach(note => {
                    notes.push(note);
                    gridContainer.addChild(note.animation);
                    gridContainer.addChild(note.touchPerfectAnimation);
                });
                updateAllNotesPosition();
            }
        }
        
        // 创建进度条
        function createProgressBar() {
            const barWidth = app.screen.width * 0.8;
            const barHeight = 8;
            const barX = (app.screen.width - barWidth) / 2;
            const barY = 20;
            
            // 背景
            if (!progressBackground) {
                progressBackground = new PIXI.Graphics();
                progressContainer.addChild(progressBackground);
            }
            progressBackground.clear();
            progressBackground.beginFill(0x000000, 0.3);
            progressBackground.drawRoundedRect(barX, barY, barWidth, barHeight, 4);
            progressBackground.endFill();
            
            // 进度条
            if (!progressBar) {
                progressBar = new PIXI.Graphics();
                progressContainer.addChildAt(progressBar, 0);
            }
            progressBar.clear();
            progressBar.beginFill(0x3498db, 0.8);
            progressBar.drawRoundedRect(barX, barY, 0, barHeight, 4);
            progressBar.endFill();
            
            // 时间文本
            if (!progressText) {
                progressText = new PIXI.Text('0:00 / 0:00', {
                    fontFamily: 'Arial',
                    fontSize: 14,
                    fill: 0xffffff,
                    align: 'center'
                });
                progressContainer.addChild(progressText);
            }
            progressText.x = app.screen.width / 2;
            progressText.y = barY + barHeight + 5;
            progressText.anchor.set(0.5, 0);
            
            // 添加交互区域用于点击
            let clickArea = progressContainer.getChildByName('progressClickArea');
            if (!clickArea) {
                clickArea = new PIXI.Graphics();
                clickArea.name = 'progressClickArea';
                clickArea.interactive = true;
                clickArea.buttonMode = true;
                clickArea.on('pointerdown', onProgressClick);
                progressContainer.addChild(clickArea);
            }
            clickArea.clear();
            clickArea.beginFill(0x000000, 0); // 透明
            clickArea.drawRect(barX - 10, barY - 10, barWidth + 20, barHeight + 20);
            clickArea.endFill();
        }
        
        // 进度条点击事件
        function onProgressClick(event) {
            if (!audioBuffer) return;
            
            const duration = audioBuffer.duration;
            const barWidth = app.screen.width * 0.8;
            const barX = (app.screen.width - barWidth) / 2;
            
            const localPos = event.data.getLocalPosition(progressContainer);
            const relativeX = localPos.x - barX;
            let progress = relativeX / barWidth;
            progress = Math.max(0, Math.min(1, progress));
            
            // 跳转到对应位置
            if (isPlaying) {
                stopAudio();
            }
            pauseTime = duration * progress;
            playAudio();
        }
        
        // 更新进度条
        function updateProgress() {
            if (!isPlaying || !audioBuffer || !progressBar) return;
            
            const currentTime = getCurrentTime();
            const duration = audioBuffer.duration;
            const progress = Math.min(currentTime / duration, 1);
            
            const barWidth = app.screen.width * 0.8;
            const barX = (app.screen.width - barWidth) / 2;
            const barHeight = 8;
            const barY = 20;
            
            // 更新进度条宽度
            progressBar.clear();
            progressBar.beginFill(0x3498db, 0.8);
            progressBar.drawRoundedRect(barX, barY, barWidth * progress, barHeight, 4);
            progressBar.endFill();
            
            // 更新时间文本
            const currentMinutes = Math.floor(currentTime / 60);
            const currentSeconds = Math.floor(currentTime % 60);
            const totalMinutes = Math.floor(duration / 60);
            const totalSeconds = Math.floor(duration % 60);
            
            progressText.text = `${currentMinutes}:${String(currentSeconds).padStart(2, '0')} / ${totalMinutes}:${String(totalSeconds).padStart(2, '0')}`;
        }
        
        // 更新进度条位置
        function updateProgressPosition() {
            if (!progressBackground || !progressBar || !progressText) return;
            
            const barWidth = app.screen.width * 0.8;
            const barHeight = 8;
            const barX = (app.screen.width - barWidth) / 2;
            const barY = 20;
            
            // 重新绘制背景
            progressBackground.clear();
            progressBackground.beginFill(0x000000, 0.3);
            progressBackground.drawRoundedRect(barX, barY, barWidth, barHeight, 4);
            progressBackground.endFill();
            
            // 更新文本位置
            progressText.x = app.screen.width / 2;
            progressText.y = barY + barHeight + 5;
        }

        // 解析谱面文件
        async function loadChart() {
            try {
                const response = await fetch(chartPath);
                const text = await response.text();
                const lines = text.split('\n');
                
                chartData = [];
                
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('#')) {
                        // 格式: #格子编号.毫秒数
                        const content = trimmed.substring(1);
                        const dotIndex = content.indexOf('.');
                        
                        if (dotIndex !== -1) {
                            const cellNumber = parseInt(content.substring(0, dotIndex));
                            const timeMs = parseInt(content.substring(dotIndex + 1));
                            
                            // 将格子编号转换为行列 (1-16 -> 0-15)
                            const cellIndex = cellNumber - 1;
                            const row = Math.floor(cellIndex / 4);
                            const col = cellIndex % 4;
                            
                            chartData.push({
                                cellIndex: cellIndex,
                                row: row,
                                col: col,
                                time: timeMs
                            });
                        }
                    }
                }
                
                // 按时间排序
                chartData.sort((a, b) => a.time - b.time);
                
                console.log(`谱面加载成功，共 ${chartData.length} 个note`);
                
                // 初始化所有格子的note
                initNotes();
                
            } catch (error) {
                console.error('谱面加载失败:', error);
            }
        }
        
        // 初始化所有格子的note对象
        function initNotes() {
            for (let i = 0; i < totalCells; i++) {
                const row = Math.floor(i / 4);
                const col = i % 4;
                
                // 创建帧动画
                const textures = [];
                for (let frame = 1; frame <= totalFrames; frame++) {
                    const frameNumber = String(frame).padStart(4, '0');
                    const texture = PIXI.Texture.from(`${markerBasePath}base${frameNumber}.png`);
                    textures.push(texture);
                }
                
                const animation = new PIXI.AnimatedSprite(textures);
                animation.animationSpeed = 0;
                animation.loop = false;
                animation.visible = false;
                animation.gotoAndStop(0);
                
                // 创建touch_perfect动画
                const touchPerfectTextures = [];
                for (let frame = 1; frame <= touchPerfectFrames; frame++) {
                    const frameNumber = String(frame).padStart(4, '0');
                    const texture = PIXI.Texture.from(`${touchPerfectPath}perfect${frameNumber}.png`);
                    touchPerfectTextures.push(texture);
                }
                
                const touchPerfectAnimation = new PIXI.AnimatedSprite(touchPerfectTextures);
                touchPerfectAnimation.animationSpeed = 0.8;
                touchPerfectAnimation.loop = false;
                touchPerfectAnimation.visible = false;
                touchPerfectAnimation.gotoAndStop(0);
                
                notes.push({
                    animation: animation,
                    touchPerfectAnimation: touchPerfectAnimation,
                    cellIndex: i,
                    row: row,
                    col: col,
                    currentFrame: 0,
                    isActive: false,
                    startTime: 0,
                    isTouching: false
                });
                
                gridContainer.addChild(animation);
                gridContainer.addChild(touchPerfectAnimation);
                
                // 添加交互事件
                animation.interactive = true;
                animation.buttonMode = true;
                animation.cursor = 'pointer';
                
                // 触摸/点击事件
                animation.on('pointerdown', () => handleTouch(i));
            }
            
            // 创建Start Here提示文本
            createStartHereHints();
            
            // 更新所有note的位置
            updateAllNotesPosition();
        }
        
        // 创建Start Here提示
        function createStartHereHints() {
            // 清除旧的提示
            startHereTexts.forEach(text => {
                if (text.parent) {
                    text.parent.removeChild(text);
                }
            });
            startHereTexts = [];
            
            if (chartData.length === 0) return;
            
            // 找到最早的note时间
            const sortedNotes = [...chartData].sort((a, b) => a.time - b.time);
            const earliestTime = sortedNotes[0].time;
            
            // 只找出时间完全等于最早时间的note（同时出现的）
            const simultaneousNotes = sortedNotes.filter(n => n.time === earliestTime);
            
            console.log(`最早的note时间: ${earliestTime}ms, 同时出现的note数量: ${simultaneousNotes.length}`);
            
            // 为这些同时出现的note的格子创建提示
            simultaneousNotes.forEach(note => {
                const text = new PIXI.Text('START HERE', {
                    fontFamily: 'Arial',
                    fontSize: 16,
                    fontWeight: 'bold',
                    fill: 0xffff00,
                    stroke: 0x000000,
                    strokeThickness: 3,
                    align: 'center'
                });
                text.anchor.set(0.5);
                text.visible = false;
                gridContainer.addChild(text);
                
                startHereTexts.push({
                    text: text,
                    cellIndex: note.cellIndex,
                    row: note.row,
                    col: note.col,
                    firstNoteTime: note.time
                });
            });
        }
        
        // 更新Start Here提示位置和可见性
        function updateStartHereHints() {
            if (startHereTexts.length === 0) return;
            
            const currentTime = isPlaying && audioContext ? getCurrentTime() * 1000 : 0; // 转换为毫秒
            
            startHereTexts.forEach(hint => {
                // 更新位置
                hint.text.x = hint.col * cellSize + cellSize / 2;
                hint.text.y = hint.row * cellSize + cellSize / 2;
                
                // 判断是否应该显示：在当前时间之前且距离note还有至少800ms
                const timeToNote = hint.firstNoteTime - currentTime;
                
                if (timeToNote > 800 && timeToNote < 3000) {
                    // 在note出现前800ms到3000ms之间显示
                    hint.text.visible = true;
                    // 根据距离调整透明度
                    const alpha = Math.min(1, timeToNote / 2000);
                    hint.text.alpha = alpha;
                } else if (timeToNote >= 3000) {
                    // 距离还很远，显示但完全透明
                    hint.text.visible = true;
                    hint.text.alpha = 0;
                } else {
                    // note已经出现或即将出现，隐藏
                    hint.text.visible = false;
                }
            });
        }
        
        // 更新所有note的位置和大小
        function updateAllNotesPosition() {
            notes.forEach(note => {
                const animSize = cellSize;
                note.animation.width = animSize;
                note.animation.height = animSize;
                note.animation.x = note.col * cellSize;
                note.animation.y = note.row * cellSize;
                
                // touch_perfect动画也需要同样的位置和大小
                note.touchPerfectAnimation.width = animSize;
                note.touchPerfectAnimation.height = animSize;
                note.touchPerfectAnimation.x = note.col * cellSize;
                note.touchPerfectAnimation.y = note.row * cellSize;
            });
        }
        
        // 处理触摸/点击事件
        function handleTouch(cellIndex) {
            if (!isPlaying || !audioContext) return;
            
            const currentTime = getCurrentTime() * 1000; // 转换为毫秒
            const note = notes[cellIndex];
            
            // 查找该格子最近的note
            const cellNotes = chartData.filter(n => n.cellIndex === cellIndex);
            if (cellNotes.length === 0) return;
            
            // 找到最近的note
            let closestNote = null;
            let minTimeDiff = Infinity;
            
            for (const noteData of cellNotes) {
                const timeDiff = Math.abs(currentTime - noteData.time);
                if (timeDiff < minTimeDiff) {
                    minTimeDiff = timeDiff;
                    closestNote = noteData;
                }
            }
            
            if (!closestNote) return;
            
            // 计算当前应该显示的帧
            const frameDuration = 1000 / 30; // 30fps
            const preDisplayFrames = 16;
            const timeDiff = currentTime - closestNote.time;
            
            let currentFrameIndex = -1;
            
            // 如果在预显示范围内
            if (timeDiff >= -(preDisplayFrames * frameDuration) && timeDiff < 0) {
                currentFrameIndex = Math.floor((preDisplayFrames * frameDuration + timeDiff) / frameDuration);
            }
            // 如果在命中点或后续显示范围内
            else if (timeDiff >= 0) {
                currentFrameIndex = Math.floor(timeDiff / frameDuration) + preDisplayFrames;
            }
            
            // 判定：如果当前帧在perfect窗口内（base0016~18，即帧15~17）
            if (currentFrameIndex >= perfectWindowStart && currentFrameIndex <= perfectWindowEnd) {
                // 触发touch_perfect动画
                triggerTouchPerfect(note);
                console.log(`Perfect! Cell ${cellIndex + 1}, Frame ${currentFrameIndex + 1}`);
            }
        }
        
        // 触发touch_perfect动画
        function triggerTouchPerfect(note) {
            // 重置并播放touch_perfect动画
            note.touchPerfectAnimation.gotoAndStop(0);
            note.touchPerfectAnimation.visible = true;
            note.touchPerfectAnimation.play();
            note.isTouching = true;
            
            // 动画播放完后自动隐藏
            setTimeout(() => {
                note.touchPerfectAnimation.visible = false;
                note.touchPerfectAnimation.stop();
                note.isTouching = false;
            }, 500); // 约500ms后隐藏（15帧 * 33.33ms ≈ 500ms）
        }
        
        // 根据当前音频时间更新所有note的帧
        function updateNotes(currentTimeMs) {
            notes.forEach((note, index) => {
                // 查找该格子的所有note
                const cellNotes = chartData.filter(n => n.cellIndex === index);
                
                if (cellNotes.length > 0) {
                    let shouldShow = false;
                    let frameIndex = 0;
                    
                    // 按照30fps计算，每帧约33.33ms
                    const frameDuration = 1000 / 30; // 约33.33ms每帧
                    const preDisplayFrames = 16; // 提前16帧开始显示
                    const preDisplayTime = preDisplayFrames * frameDuration; // 约533ms
                    const totalAnimFrames = 25; // 总共25帧
                    const postDisplayFrames = totalAnimFrames - preDisplayFrames; // 后续9帧
                    const postDisplayTime = postDisplayFrames * frameDuration; // 约300ms
                    
                    // 遍历该格子的所有note，找到当前应该显示的帧
                    for (const noteData of cellNotes) {
                        const timeDiff = currentTimeMs - noteData.time;
                        
                        // 如果在预显示范围内（前267ms）
                        if (timeDiff >= -preDisplayTime && timeDiff < 0) {
                            shouldShow = true;
                            // 计算帧索引：从0到15
                            frameIndex = Math.floor((preDisplayTime + timeDiff) / frameDuration);
                            frameIndex = Math.max(0, Math.min(preDisplayFrames - 1, frameIndex));
                            break;
                        }
                        // 如果在命中点或后续显示范围内（0到150ms）
                        else if (timeDiff >= 0 && timeDiff < postDisplayTime) {
                            shouldShow = true;
                            // 计算帧索引：从16到24
                            frameIndex = Math.floor(timeDiff / frameDuration) + preDisplayFrames;
                            frameIndex = Math.max(preDisplayFrames, Math.min(totalAnimFrames - 1, frameIndex));
                            break;
                        }
                    }
                    
                    if (shouldShow && frameIndex >= 0 && frameIndex < totalAnimFrames) {
                        note.animation.visible = true;
                        note.animation.gotoAndStop(frameIndex);
                    } else {
                        note.animation.visible = false;
                    }
                } else {
                    // 该格子没有任何note
                    note.animation.visible = false;
                }
            });
        }

        // 初始化Web Audio API
        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            loadAudio();
        }
        
        // 加载音频文件
        async function loadAudio() {
            try {
                const response = await fetch(songPath);
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                console.log('音频加载成功');
            } catch (error) {
                console.error('音频加载失败:', error);
            }
        }
        
        // 播放音频
        function playAudio() {
            if (!audioBuffer) {
                console.log('音频未加载');
                return;
            }
            
            // 如果正在播放，先暂停
            if (isPlaying && audioSource) {
                pauseTime = audioContext.currentTime - startTime;
                try {
                    audioSource.stop();
                } catch (e) {
                    // 忽略错误
                }
                audioSource = null;
                isPlaying = false;
                updatePlayButton();
                return;
            }
            
            // 创建新的音源
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(audioContext.destination);
            
            // 从暂停位置开始播放
            const offset = pauseTime % audioBuffer.duration;
            audioSource.start(0, offset);
            startTime = audioContext.currentTime - offset;
            
            // 显示进度条
            domProgressContainer.style.display = 'flex';
            
            audioSource.onended = () => {
                if (isPlaying) {
                    isPlaying = false;
                    pauseTime = 0;
                    audioSource = null;
                    updatePlayButton();
                    // 隐藏进度条
                    domProgressContainer.style.display = 'none';
                    progressBarFill.style.width = '0%';
                    progressTimeText.textContent = '0:00 / 0:00';
                }
            };
            
            isPlaying = true;
            updatePlayButton();
        }
        
        // 停止音频（完全停止，重置到开头）
        function stopAudio() {
            if (audioSource) {
                try {
                    audioSource.stop();
                } catch (e) {
                    // 忽略错误
                }
                audioSource = null;
            }
            
            isPlaying = false;
            pauseTime = 0;
            updatePlayButton();
        }
        
        // 获取当前播放时间
        function getCurrentTime() {
            if (isPlaying && audioContext) {
                return audioContext.currentTime - startTime;
            }
            return pauseTime;
        }
        
        // 更新播放按钮状态
        function updatePlayButton() {
            const button = document.getElementById('playButton');
            if (button) {
                button.textContent = isPlaying ? '暂停' : '播放';
            }
        }
        
        // 绑定播放按钮事件
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.getElementById('playButton');
            if (button) {
                button.addEventListener('click', () => {
                    // 首次点击时恢复AudioContext（浏览器策略要求）
                    if (audioContext && audioContext.state === 'suspended') {
                        audioContext.resume();
                    }
                    playAudio();
                });
            }
        });


        // 定位网格使其居底
        // 初始创建网格
        createGrid();
        
        // 动画循环 - 同步帧动画和音频
        app.ticker.add(() => {
            // 始终更新Start Here提示（即使未播放）
            updateStartHereHints();
            
            if (isPlaying && audioContext) {
                const currentTime = getCurrentTime() * 1000; // 转换为毫秒
                updateNotes(currentTime);
                updateProgress(); // 更新进度条
            }
        });

        // 窗口大小改变时重新调整
        let resizeTimeout;
        function handleResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const newSize = getContainerSize();
                app.renderer.resize(newSize.width, newSize.height);
                createGrid();
            }, 100); // 防抖100ms
        }
        
        window.addEventListener('resize', handleResize);
        
        // 监听窗口状态变化（最大化/还原）
        let lastWidth = window.innerWidth;
        let lastHeight = window.innerHeight;
        
        function checkWindowSize() {
            if (window.innerWidth !== lastWidth || window.innerHeight !== lastHeight) {
                lastWidth = window.innerWidth;
                lastHeight = window.innerHeight;
                handleResize();
            }
            requestAnimationFrame(checkWindowSize);
        }
        
        // 启动窗口大小检测
        checkWindowSize();
        
        // 解析URL参数（必须在initAudio和loadChart之前）
        parseURLParams();
        
        // 初始化音频
        initAudio();
        
        // 加载谱面
        loadChart();
        
        // DOM进度条相关元素
        const domProgressContainer = document.getElementById('progressContainer');
        const progressBarWrapper = document.getElementById('progressBarWrapper');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressTimeText = document.getElementById('progressTime');
        
        // 更新DOM进度条
        function updateProgress() {
            if (!isPlaying || !audioBuffer) return;
            
            const currentTime = getCurrentTime();
            const duration = audioBuffer.duration;
            const progress = Math.min(currentTime / duration, 1);
            
            // 更新进度条宽度
            progressBarFill.style.width = (progress * 100) + '%';
            
            // 更新时间文本
            const currentMinutes = Math.floor(currentTime / 60);
            const currentSeconds = Math.floor(currentTime % 60);
            const totalMinutes = Math.floor(duration / 60);
            const totalSeconds = Math.floor(duration % 60);
            
            progressTimeText.textContent = `${currentMinutes}:${String(currentSeconds).padStart(2, '0')} / ${totalMinutes}:${String(totalSeconds).padStart(2, '0')}`;
        }
        
        // 进度条点击事件
        progressBarWrapper.addEventListener('click', (e) => {
            if (!audioBuffer) {
                console.log('音频未加载');
                return;
            }
            
            const rect = progressBarWrapper.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const progress = clickX / rect.width;
            const clampedProgress = Math.max(0, Math.min(1, progress));
            
            const duration = audioBuffer.duration;
            const newTime = duration * clampedProgress;
            
            console.log('点击进度条:', {
                progress: clampedProgress,
                newTime: newTime,
                wasPlaying: isPlaying,
                currentPauseTime: pauseTime
            });
            
            // 如果正在播放，停止当前音源
            if (isPlaying && audioSource) {
                try {
                    audioSource.stop();
                } catch (e) {
                    console.log('停止音源错误:', e);
                }
                audioSource = null;
                isPlaying = false; // 重要：重置播放状态
            }
            
            // 设置新的播放位置
            pauseTime = newTime;
            console.log('设置pauseTime为:', pauseTime);
            
            // 如果之前在播放，则继续播放
            if (isPlaying) {
                console.log('继续播放');
                playAudio();
            } else {
                // 如果之前是暂停状态，更新按钮显示
                console.log('保持暂停状态');
                updatePlayButton();
            }
        });
    </script>
</body>
</html>
